[project]
name = "deepseek-ocr-cli"
version = "0.4.3"
description = "CLI tool for OCR using DeepSeek-OCR model via Ollama or vLLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruben Fernandez Fuertes", email = "fernandezfuertesruben@gmail.com" }]
keywords = ["ocr", "deepseek", "cli", "pdf", "document-processing", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "ocr-output-contract @ git+https://github.com/r-uben/ocr-output-contract@v0.1.0",
    "pillow>=11.0.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.1",
    "rich>=13.9.4",
    "requests>=2.31.0",
]

[project.urls]
repository = "https://github.com/r-uben/deepseek-ocr-cli"
homepage = "https://github.com/r-uben/deepseek-ocr-cli"

[project.optional-dependencies]
vllm = ["openai>=1.0.0"]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-pillow>=10.2.0",
    "types-requests>=2.31.0",
]

[project.scripts]
deepseek-ocr = "deepseek_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepseek_ocr"]

# Required so the git+https direct reference to ocr-output-contract is allowed.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["integration: hits live models/servers; excluded from default run"]
addopts = "-m 'not integration'"
